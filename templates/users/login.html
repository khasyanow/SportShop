{% extends 'base.html' %}

{% block title %}Вход в систему — СпортМаркет{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 p-4">
            <h3 class="fw-bold text-center mb-4"><i class="bi bi-box-arrow-in-right me-2"></i>Авторизация</h3>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Имя пользователя или Email</label>
                    <input type="text" name="username" class="form-control" placeholder="Логин или адрес почты" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Пароль</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-warning w-100 fw-semibold py-2">Войти</button>
            </form>
            <div class="text-center mt-3">
                <span class="text-muted small">Еще нет аккаунта? </span>
                <a href="{% url 'users:register' %}" class="small text-decoration-none fw-semibold">Зарегистрироваться</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
